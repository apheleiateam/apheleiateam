<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#030503" />
    <script>
      // Apply the saved / system theme before first paint to avoid a flash.
      ;(function () {
        var t = new URLSearchParams(location.search).get('theme') // ?theme=light|dark preview
        if (t !== 'light' && t !== 'dark') try { t = localStorage.getItem('apheleia-theme') } catch (e) {}
        if (t !== 'light' && t !== 'dark') t = window.matchMedia && matchMedia('(prefers-color-scheme: light)').matches ? 'light' : 'dark'
        document.documentElement.dataset.theme = t
      })()
    </script>
    <meta name="description" content="Apheleia designs and builds digital products that feel effortless — simple on the surface, engineered to scale underneath. A studio of six co-founders in Tamil Nadu, India." />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Quicksand:wght@500;600;700&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet" />
    <title>Apheleia — Ideas to Impact</title>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
