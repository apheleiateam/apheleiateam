<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 420" width="1280" height="420" role="img" aria-label="Apheleia — Ideas to Impact">
  <defs>
    <linearGradient id="accent" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#e2f7b8"/>
      <stop offset=".5" stop-color="#9cf06b"/>
      <stop offset="1" stop-color="#46d35b"/>
    </linearGradient>
    <linearGradient id="impact" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#e2f7b8"/>
      <stop offset=".55" stop-color="#9cf06b"/>
      <stop offset="1" stop-color="#46d35b"/>
    </linearGradient>
    <radialGradient id="glowA" cx="78%" cy="40%" r="45%">
      <stop offset="0" stop-color="#46d35b" stop-opacity=".38"/>
      <stop offset="1" stop-color="#46d35b" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="glowB" cx="8%" cy="100%" r="40%">
      <stop offset="0" stop-color="#0f2416" stop-opacity=".9"/>
      <stop offset="1" stop-color="#0f2416" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="orbBody" cx="34%" cy="28%" r="80%">
      <stop offset="0" stop-color="#239447"/>
      <stop offset=".42" stop-color="#0f2416"/>
      <stop offset="1" stop-color="#030503"/>
    </radialGradient>
    <radialGradient id="orbRim" cx="40%" cy="38%" r="65%">
      <stop offset=".72" stop-color="#9cf06b" stop-opacity="0"/>
      <stop offset=".96" stop-color="#9cf06b" stop-opacity=".55"/>
      <stop offset="1" stop-color="#e2f7b8" stop-opacity=".9"/>
    </radialGradient>
    <linearGradient id="ring" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#46d35b" stop-opacity="0"/>
      <stop offset=".55" stop-color="#9cf06b"/>
      <stop offset="1" stop-color="#e2f7b8" stop-opacity=".15"/>
    </linearGradient>
    <linearGradient id="silk" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#46d35b" stop-opacity="0"/>
      <stop offset=".35" stop-color="#9cf06b" stop-opacity=".9"/>
      <stop offset=".72" stop-color="#46d35b" stop-opacity=".6"/>
      <stop offset="1" stop-color="#e2f7b8" stop-opacity="0"/>
    </linearGradient>
    <filter id="blur" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="40"/>
    </filter>
    <clipPath id="frame"><rect width="1280" height="420" rx="24"/></clipPath>
    <clipPath id="orbClip"><circle cx="1010" cy="200" r="118"/></clipPath>
  </defs>

  <g clip-path="url(#frame)">
