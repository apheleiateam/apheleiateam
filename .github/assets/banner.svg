    <rect width="1280" height="420" fill="url(#glowA)"/>
    <rect width="1280" height="420" fill="url(#glowB)"/>

    <!-- faint grid lines -->
    <g stroke="#d6e6d4" stroke-opacity=".04">
      <path d="M0 105H1280M0 210H1280M0 315H1280"/>
      <path d="M160 0V420M320 0V420M480 0V420M640 0V420M800 0V420M960 0V420M1120 0V420"/>
    </g>

    <!-- silk ribbon -->
    <g fill="none" stroke="url(#silk)">
      <path d="M-60 360C300 300 780 400 1340 190" stroke-width="56" stroke-opacity=".05"/>
      <path d="M-60 384C300 282 780 412 1340 182" stroke-opacity=".08"/>
      <path d="M-60 380C300 287 780 406 1340 186" stroke-opacity=".14"/>
      <path d="M-60 376C300 292 780 400 1340 190" stroke-opacity=".22"/>
      <path d="M-60 372C300 297 780 394 1340 194" stroke-opacity=".3"/>
      <path d="M-60 368C300 302 780 388 1340 198" stroke-opacity=".38"/>
      <path d="M-60 364C300 307 780 382 1340 202" stroke-opacity=".44"/>
      <path d="M-60 360C300 312 780 376 1340 206" stroke-opacity=".48"/>
      <path d="M-60 356C300 317 780 370 1340 210" stroke-opacity=".5"/>
      <path d="M-60 352C300 322 780 364 1340 214" stroke-opacity=".48"/>
      <path d="M-60 348C300 327 780 358 1340 218" stroke-opacity=".44"/>
      <path d="M-60 344C300 332 780 352 1340 222" stroke-opacity=".38"/>
      <path d="M-60 340C300 337 780 346 1340 226" stroke-opacity=".3"/>
      <path d="M-60 336C300 342 780 340 1340 230" stroke-opacity=".22"/>
      <path d="M-60 332C300 347 780 334 1340 234" stroke-opacity=".14"/>
      <path d="M-60 328C300 352 780 328 1340 238" stroke-opacity=".08"/>
    </g>

    <!-- orb -->
    <circle cx="1024" cy="214" r="130" fill="#46d35b" opacity=".3" filter="url(#blur)"/>
    <g transform="rotate(-18 1010 200)" fill="none" stroke="url(#ring)">
      <path d="M842 200A168 46 0 0 1 1178 200" stroke-width="1.4" opacity=".45"/>
    </g>
    <circle cx="1010" cy="200" r="118" fill="url(#orbBody)"/>
    <g clip-path="url(#orbClip)" fill="none" stroke="#e2f7b8" stroke-opacity=".07">
      <ellipse cx="1010" cy="200" rx="118" ry="21"/>
      <ellipse cx="1010" cy="200" rx="118" ry="50"/>
      <ellipse cx="1010" cy="200" rx="118" ry="78"/>
      <ellipse cx="1010" cy="200" rx="30" ry="118"/>
      <ellipse cx="1010" cy="200" rx="65" ry="118"/>
      <ellipse cx="1010" cy="200" rx="100" ry="118"/>
    </g>
    <circle cx="1010" cy="200" r="118" fill="url(#orbRim)"/>
    <g transform="rotate(-18 1010 200)" fill="none" stroke="url(#ring)">
      <path d="M842 200A168 46 0 0 0 1178 200" stroke-width="2"/>
      <circle cx="1094" cy="240" r="4" fill="#9cf06b" stroke="none"/>
      <circle cx="1094" cy="240" r="11" fill="#9cf06b" stroke="none" opacity=".2"/>
    </g>

    <!-- stars -->
    <path transform="translate(1180 52) scale(.9)" d="M12 0C12.7 6.4 17.6 11.3 24 12C17.6 12.7 12.7 17.6 12 24C11.3 17.6 6.4 12.7 0 12C6.4 11.3 11.3 6.4 12 0Z" fill="#e2f7b8" opacity=".85"/>
    <path transform="translate(840 70) scale(.5)" d="M12 0C12.7 6.4 17.6 11.3 24 12C17.6 12.7 12.7 17.6 12 24C11.3 17.6 6.4 12.7 0 12C6.4 11.3 11.3 6.4 12 0Z" fill="#e2f7b8" opacity=".6"/>
    <path transform="translate(1196 330) scale(.45)" d="M12 0C12.7 6.4 17.6 11.3 24 12C17.6 12.7 12.7 17.6 12 24C11.3 17.6 6.4 12.7 0 12C6.4 11.3 11.3 6.4 12 0Z" fill="#e2f7b8" opacity=".5"/>

    <!-- wordmark -->
    <g transform="translate(88 88)">
      <path transform="scale(1.25)" d="M12 0C12.7 6.4 17.6 11.3 24 12C17.6 12.7 12.7 17.6 12 24C11.3 17.6 6.4 12.7 0 12C6.4 11.3 11.3 6.4 12 0Z" fill="url(#accent)"/>
      <text x="44" y="23" font-family="Inter, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="22" font-weight="600" letter-spacing=".5" fill="#eef4ec">Apheleia</text>
    </g>

    <text x="84" y="226" font-family="Quicksand, 'Varela Round', 'Segoe UI', Arial, sans-serif" font-weight="700" font-size="96" fill="#eef4ec">Ideas to</text>
    <text x="84" y="314" font-family="Quicksand, 'Varela Round', 'Segoe UI', Arial, sans-serif" font-weight="700" font-size="96" font-style="italic" fill="url(#impact)">Impact.</text>

    <text x="88" y="368" font-family="Inter, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="15" letter-spacing="3" fill="#d6e6d4" fill-opacity=".6">DESIGN · DEVELOPMENT · ARCHITECTURE · STRATEGY</text>

    <rect x=".5" y=".5" width="1279" height="419" rx="23.5" fill="none" stroke="#d6e6d4" stroke-opacity=".09"/>
  </g>
</svg>
